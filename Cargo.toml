[package]
name = "pankarta-software"
version = "0.1.0"
edition = "2021"
description = "A Rust game engine: wgpu rendering, rapier physics, SDL2 windowing, input and audio, with scenes made of nodes, properties and behaviours"
license = "MIT"
repository = "https://github.com/Khalzz/Pankarta-Software"
readme = "README.md"
keywords = ["gamedev", "engine", "wgpu", "3d", "game"]
categories = ["game-engines", "rendering"]
# What goes in the published crate: the engine, the fonts its UI embeds,
# the examples and docs - not the SDL2 binaries or the examples' assets.
include = ["src/**", "assets/fonts/Inter-*.ttf", "assets/fonts/Inter-LICENSE.txt", "examples/**", "docs/**", "Cargo.toml", "README.md", "LICENSE"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
sdl2 = {version = "0.37", default-features = false, features = ["raw-window-handle" ]}
wgpu = "25"
tokio = { version = "1.45", features = ["full"] }
bytemuck = { version = "1.23", features = [ "derive" ] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
rand = "0.8"
glyphon = "0.9"
rodio = "0.20"

# Physics
rapier3d = { version = "0.26", features = [ "simd-stable", "serde-serialize", "parallel" ] }
nalgebra = "0.33"

# External file management
serde = { version = "1.0", features = ["derive"] }
ron = "0.10"

# The game's debug windows (see DebugUi)
egui = "0.32"
egui-wgpu = "0.32"

# Examples in a subfolder of examples/ are listed here; ones directly in
# examples/ are found on their own.
[[example]]
name = "basic_window"
path = "examples/window/basic_window.rs"

[[example]]
name = "configurable_window"
path = "examples/window/configurable_window.rs"

[[example]]
name = "ui_components"
path = "examples/UI/components.rs"

[[example]]
name = "ui_greetings"
path = "examples/UI/greetings.rs"

[[example]]
name = "input"
path = "examples/input/input.rs"

[[example]]
name = "2d"
path = "examples/2D/2d.rs"

[[example]]
name = "model_viewer"
path = "examples/3D/model_viewer.rs"

[[example]]
name = "water"
path = "examples/3D/water/water.rs"

[[example]]
name = "free_camera"
path = "examples/3D/free_camera.rs"

[[example]]
name = "walking"
path = "examples/3D/walking/main.rs"

[[example]]
name = "particles"
path = "examples/3D/particles.rs"

[[example]]
name = "text_and_lines"
path = "examples/3D/text_and_lines.rs"

[[example]]
name = "meshes_and_models"
path = "examples/3D/meshes_and_models.rs"

[[example]]
name = "orthographic"
path = "examples/3D/orthographic.rs"

[[example]]
name = "far_from_origin"
path = "examples/3D/far_from_origin.rs"

[[example]]
name = "scene_loading"
path = "examples/scenes/loading.rs"

[dependencies.gltf]
version = "1.4"
features = ["extras", "names", "utils"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
